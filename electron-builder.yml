# CodeAtlas 打包配置:产出 Windows 安装包(nsis)
# 铁则:tree-sitter 的语法字典是运行时按真实文件读的,asar 包不住这种用法 ——
# 所以用 extraResources 把「用到的字典」放进 <安装目录>/resources/wasm/,
# 运行时由 src/native/wasmPaths.ts 认文件寻路(文件在才走打包分支)。
# 新增语言支持时:同步把对应的 tree-sitter-<语言>.wasm 加进下面 filter 清单!
appId: com.feix95.codeatlas
productName: CodeAtlas
# CI 里打 tag 自动出的包先进 GitHub Releases 草稿箱,人工过目后点发布,不裸奔
publish:
  provider: github
  releaseType: draft
directories:
  output: dist
files:
  - out/**
  - package.json
extraResources:
  # 引擎本体(186KB)
  - from: node_modules/web-tree-sitter/tree-sitter.wasm
    to: wasm/tree-sitter.wasm
  # 各语言语法字典(按需带,全家 50MB 不搬;与 analyzer/highlight 的 GRAMMAR_FILES 对应)
  - from: node_modules/tree-sitter-wasms/out
    to: wasm
    filter:
      - tree-sitter-tsx.wasm
      - tree-sitter-python.wasm
      - tree-sitter-java.wasm
      - tree-sitter-go.wasm
      - tree-sitter-c.wasm
      - tree-sitter-cpp.wasm
      - tree-sitter-c_sharp.wasm
      - tree-sitter-rust.wasm
      - tree-sitter-json.wasm
      - tree-sitter-css.wasm
      - tree-sitter-html.wasm
      - tree-sitter-bash.wasm
      - tree-sitter-yaml.wasm
      - tree-sitter-toml.wasm
  # AI 引擎随包(llama.cpp CPU 版,任何 x64 机器能跑;来源见 release.yml 下载步骤,
  # 本地开发放 vendor/llama-cpp/,已 gitignore)。运行时 resolveServerProgram 认这个位置
  - from: vendor/llama-cpp
    to: llama-cpp
  # 托盘图标(桌宠托管第一锤):打包后 Tray 从 resources/app.ico 认;开发模式直接读 build/icon.ico
  - from: build/icon.ico
    to: app.ico
win:
  # 应用图标(2026-09-17 小葵点头换掉 Electron 出厂原子图):build/icons-src/ 是 SVG 设计源,
  # 跑 scripts/make-icon.mts 重新生成 ico(小尺寸走加粗简化版,任务栏 16px 不糊)
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  # 向导式安装(2026-09-16 小葵定):有「下一步」页面可选安装目录,不再双击就闷头装。
  # per-user 安装(不需管理员权限);卸载默认保留 %APPDATA%\CodeAtlas 用户数据,
  # README 的「彻底卸载」一节有说明(oneClick 独有的 deleteAppDataOnUninstall 在此模式不可用)
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  artifactName: ${productName}-Setup-${version}.${ext}
