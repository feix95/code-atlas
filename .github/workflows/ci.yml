# PR 打向 main 时跑全套自测,作为合进前检查闸;push main 仍跑,挡住不经 PR 直推。不含 test:journey;本地合进 main 前仍须自测全绿
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  # 依赖漏洞闸:查 npm advisory 要联网,单开一 job,不并入 check —— 自测一律不碰真实网络
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audit
